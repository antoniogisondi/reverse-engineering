[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sicurcantiere"
version = "0.15.0"
description = "Gestione della sicurezza nei cantieri (PSC, cronoprogramma, costi) secondo il D.Lgs. 81/2008"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "python-docx>=1.1", "openai>=3.30", "anthropic>=1.15", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "flask>=3", "cryptography>=42"]

[project.gui-scripts]
sicurcantiere-psc = "sicurcantiere.app:main_psc"
sicurcantiere-pos = "sicurcantiere.app:main_pos"
sicurcantiere-pimus = "sicurcantiere.app:main_pimus"

[tool.setuptools.packages.find]
include = ["sicurcantiere*"]

[tool.setuptools.package-data]
sicurcantiere = ["risorse/segnali/*.png", "risorse/tema/*.qss", "risorse/font/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
