[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sicurcantiere"
version = "0.1.0"
description = "Gestione della sicurezza nei cantieri (PSC, cronoprogramma, costi) secondo il D.Lgs. 81/2008"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
sicurcantiere = "sicurcantiere.app:main"

[tool.setuptools.packages.find]
include = ["sicurcantiere*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
