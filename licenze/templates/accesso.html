{% extends "base.html" %}{% block titolo %}Accesso{% endblock %}
{% block contenuto %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h2>SicurCantiere · Licenze</h2>
  <form class="corpo" method="post">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="nome">Nome utente</label><input id="nome" name="nome" autofocus required>
    <p></p><label for="password">Password</label><input id="password" name="password" type="password" required>
    <p></p><button class="primario">Accedi</button>
  </form>
</div>
{% endblock %}
